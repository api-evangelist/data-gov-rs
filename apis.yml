aid: data-gov-rs
name: data.gov.rs
description: >-
  data.gov.rs is the national government open-data portal for the Republic of Serbia, operated by the
  Office for IT and eGovernment. It runs the uData platform and exposes the uData REST API over
  approximately 3,452 datasets, supporting programmatic dataset search, metadata retrieval, organization
  listings, and resource access. The API provides a consistent JSON-over-HTTP interface and is harvested
  into the EU data portal.
